version: 1
project:
  name: agent-shield-monorepo
  root: .
checks:
- id: apps-api-lint-api
  label: apps/api - lint-api
  argv:
  - uv
  - run
  - --project
  - apps/api
  - ruff
  - check
  - apps/api/app
  - apps/api/tests
  timeout_sec: 1200
  enabled: true
- id: apps-api-typecheck-api
  label: apps/api - typecheck-api
  argv:
  - uv
  - run
  - --project
  - apps/api
  - pyright
  - apps/api/app
  - apps/api/tests
  timeout_sec: 1200
  enabled: true
- id: apps-api-test-api
  label: apps/api - test-api
  argv:
  - uv
  - run
  - --project
  - apps/api
  - pytest
  - apps/api/tests
  timeout_sec: 1800
  enabled: true
- id: apps-api-check-openapi
  label: apps/api - check-openapi
  argv:
  - uv
  - run
  - --project
  - apps/api
  - python
  - scripts/export_openapi.py
  - --check
  timeout_sec: 600
  enabled: true
- id: apps-web-lint-web
  label: apps/web - lint-web
  argv:
  - pnpm
  - lint:web
  timeout_sec: 1200
  enabled: true
- id: apps-web-typecheck-web
  label: apps/web - typecheck-web
  argv:
  - pnpm
  - typecheck:web
  timeout_sec: 1200
  enabled: true
- id: apps-web-test-web
  label: apps/web - test-web
  argv:
  - pnpm
  - test:web
  timeout_sec: 1800
  enabled: true
- id: packages-cli-lint-cli
  label: packages/cli - lint-cli
  argv:
  - uv
  - run
  - --project
  - packages/cli
  - ruff
  - check
  - packages/cli/agentshield_cli
  - packages/cli/tests
  timeout_sec: 1200
  enabled: true
- id: packages-cli-typecheck-cli
  label: packages/cli - typecheck-cli
  argv:
  - uv
  - run
  - --project
  - packages/cli
  - pyright
  - packages/cli/agentshield_cli
  - packages/cli/tests
  timeout_sec: 1200
  enabled: true
- id: packages-cli-test-cli
  label: packages/cli - test-cli
  argv:
  - uv
  - run
  - --project
  - packages/cli
  - pytest
  - packages/cli/tests
  timeout_sec: 1800
  enabled: true
llm:
  enabled: true
  provider: openai-compatible
  model: gpt-4.1-mini
  base_url: https://api-infer.agentsey.ai/v1
  base_url_env: AGENTSHIELD_LLM_BASE_URL
  api_key: sk-infer-l58w9OsyKfe9VqdI8Rt4gA
  api_key_env: AGENTSHIELD_LLM_API_KEY
  timeout_sec: 90
notify:
  enabled: false
  webhook_url_env: AGENTSHIELD_WEBHOOK_URL
  send_on:
  - failure
  timeout_sec: 10
