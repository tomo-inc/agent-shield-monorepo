version: 1
project:
  name: agentpay-sdk-internal
  root: .
checks:
- id: apps-relay-build
  label: apps/relay - build
  module: apps/relay
  kind: build
  argv:
  - pnpm
  - run
  - build
  cwd: apps/relay
  timeout_sec: 1200
  enabled: true
- id: apps-relay-lint
  label: apps/relay - lint
  module: apps/relay
  kind: lint
  argv:
  - pnpm
  - run
  - lint
  cwd: apps/relay
  timeout_sec: 1200
  enabled: true
- id: apps-relay-typecheck
  label: apps/relay - typecheck
  module: apps/relay
  kind: typecheck
  argv:
  - pnpm
  - run
  - typecheck
  cwd: apps/relay
  timeout_sec: 1200
  enabled: true
- id: apps-relay-test
  label: apps/relay - test
  module: apps/relay
  kind: test
  argv:
  - pnpm
  - run
  - test:unit
  cwd: apps/relay
  timeout_sec: 1800
  enabled: true
- id: apps-relay-coverage
  label: apps/relay - coverage
  module: apps/relay
  kind: coverage
  argv:
  - pnpm
  - exec
  - vitest
  - run
  - --coverage.enabled=true
  - --coverage.provider=v8
  - --coverage.reporter=json-summary
  - --coverage.reporter=text
  - --coverage.reportsDirectory=../../.qa-agent/generated/coverage/apps-relay
  cwd: apps/relay
  coverage_parser: istanbul-summary
  coverage_file: ../../.qa-agent/generated/coverage/apps-relay/coverage-summary.json
  timeout_sec: 1800
  enabled: true
- id: apps-web-build
  label: apps/web - build
  module: apps/web
  kind: build
  argv:
  - pnpm
  - run
  - build
  cwd: apps/web
  timeout_sec: 1200
  enabled: true
- id: apps-web-lint
  label: apps/web - lint
  module: apps/web
  kind: lint
  argv:
  - pnpm
  - exec
  - biome
  - check
  - apps/web
  timeout_sec: 1200
  enabled: true
- id: apps-web-typecheck
  label: apps/web - typecheck
  module: apps/web
  kind: typecheck
  argv:
  - pnpm
  - run
  - typecheck
  cwd: apps/web
  timeout_sec: 1200
  enabled: true
- id: apps-web-test
  label: apps/web - test
  module: apps/web
  kind: test
  argv:
  - pnpm
  - run
  - test:unit
  cwd: apps/web
  timeout_sec: 1800
  enabled: true
- id: apps-web-coverage
  label: apps/web - coverage
  module: apps/web
  kind: coverage
  argv:
  - pnpm
  - exec
  - vitest
  - run
  - --coverage.enabled=true
  - --coverage.provider=v8
  - --coverage.reporter=json-summary
  - --coverage.reporter=text
  - --coverage.reportsDirectory=../../.qa-agent/generated/coverage/apps-web
  cwd: apps/web
  coverage_parser: istanbul-summary
  coverage_file: ../../.qa-agent/generated/coverage/apps-web/coverage-summary.json
  timeout_sec: 1800
  enabled: true
- id: packages-cache-build
  label: packages/cache - build
  module: packages/cache
  kind: build
  argv:
  - pnpm
  - run
  - build
  cwd: packages/cache
  timeout_sec: 1200
  enabled: true
- id: packages-cache-lint
  label: packages/cache - lint
  module: packages/cache
  kind: lint
  argv:
  - pnpm
  - run
  - lint
  cwd: packages/cache
  timeout_sec: 1200
  enabled: true
- id: packages-cache-typecheck
  label: packages/cache - typecheck
  module: packages/cache
  kind: typecheck
  argv:
  - pnpm
  - run
  - typecheck
  cwd: packages/cache
  timeout_sec: 1200
  enabled: true
- id: packages-cache-test
  label: packages/cache - test
  module: packages/cache
  kind: test
  argv:
  - pnpm
  - run
  - test:unit
  cwd: packages/cache
  timeout_sec: 1800
  enabled: true
- id: packages-cache-coverage
  label: packages/cache - coverage
  module: packages/cache
  kind: coverage
  argv:
  - pnpm
  - exec
  - vitest
  - run
  - --coverage.enabled=true
  - --coverage.provider=v8
  - --coverage.reporter=json-summary
  - --coverage.reporter=text
  - --coverage.reportsDirectory=../../.qa-agent/generated/coverage/packages-cache
  cwd: packages/cache
  coverage_parser: istanbul-summary
  coverage_file: ../../.qa-agent/generated/coverage/packages-cache/coverage-summary.json
  timeout_sec: 1800
  enabled: true
- id: crates-build
  label: crates - build
  module: crates
  kind: build
  argv:
  - cargo
  - build
  - --workspace
  - --locked
  timeout_sec: 1800
  enabled: true
- id: crates-lint
  label: crates - lint
  module: crates
  kind: lint
  argv:
  - cargo
  - clippy
  - --workspace
  - --all-targets
  - --all-features
  - --
  - -D
  - warnings
  timeout_sec: 1200
  enabled: true
- id: crates-typecheck
  label: crates - typecheck
  module: crates
  kind: typecheck
  argv:
  - cargo
  - check
  - --workspace
  - --all-targets
  - --all-features
  - --locked
  timeout_sec: 1800
  enabled: true
- id: crates-test
  label: crates - test
  module: crates
  kind: test
  argv:
  - cargo
  - test
  - --workspace
  - --locked
  timeout_sec: 1800
  enabled: true
- id: crates-coverage
  label: crates - coverage
  module: crates
  kind: coverage
  argv:
  - node
  - -e
  - console.error('Rust coverage is not configured for this repository yet. Install cargo-llvm-cov and replace this placeholder coverage command in .agentshield/config.yaml.'); process.exit(1)
  coverage_parser: coverage.py-json
  coverage_file: .qa-agent/generated/coverage/crates/coverage.json
  timeout_sec: 300
  enabled: false
notify:
  enabled: true
  webhook_url: https://open.larksuite.com/open-apis/bot/v2/hook/500a4ec0-fd65-490c-bc07-0b02de5f654e
  webhook_url_env: AGENTSHIELD_WEBHOOK_URL
  send_on:
  - always
  timeout_sec: 10
