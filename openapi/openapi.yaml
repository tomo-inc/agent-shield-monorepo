openapi: 3.1.0
info:
  title: AgentShield QA Automation API
  summary: Phase 1 scaffold for QA automation
  description: Monorepo-aligned FastAPI service for AgentShield. Current scope is
    QA automation only.
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - system
      summary: Health check
      operationId: healthz
      responses:
        '200':
          description: Service health payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/capabilities:
    get:
      tags:
      - system
      summary: List current phase capabilities
      operationId: listCapabilities
      responses:
        '200':
          description: Current phase capability catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityCatalog'
components:
  schemas:
    Capability:
      properties:
        name:
          type: string
          title: Name
          description: Capability name
        description:
          type: string
          title: Description
          description: What the capability is responsible for
        status:
          type: string
          enum:
          - planned
          - scaffolded
          - in-progress
          - stable
          title: Status
          description: Implementation status
      type: object
      required:
      - name
      - description
      - status
      title: Capability
    CapabilityCatalog:
      properties:
        product:
          type: string
          title: Product
          description: Product name
        current_phase:
          type: string
          title: Current Phase
          description: Current roadmap phase
        required_files:
          items:
            type: string
          type: array
          title: Required Files
          description: Project governance files
        capabilities:
          items:
            $ref: '#/components/schemas/Capability'
          type: array
          title: Capabilities
          description: Supported capabilities in this phase
      type: object
      required:
      - product
      - current_phase
      - required_files
      - capabilities
      title: CapabilityCatalog
    HealthResponse:
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - error
          title: Status
          description: Health status
        service:
          type: string
          title: Service
          description: Service name
        active_focus:
          type: string
          title: Active Focus
          description: Current delivery focus
      type: object
      required:
      - status
      - service
      - active_focus
      title: HealthResponse
