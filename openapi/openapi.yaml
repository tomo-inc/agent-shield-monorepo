openapi: 3.1.0
info:
  title: AgentShield QA Automation API
  version: 0.1.0
  summary: Phase 1 scaffold for QA automation
  description: Monorepo-aligned FastAPI service for AgentShield. Current scope is QA automation only.
servers:
  - url: http://localhost:8000
paths:
  /healthz:
    get:
      tags:
        - system
      summary: Health check
      operationId: healthz
      responses:
        "200":
          description: Service health payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/capabilities:
    get:
      tags:
        - system
      summary: List current phase capabilities
      operationId: listCapabilities
      responses:
        "200":
          description: Current phase capability catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityCatalog"
components:
  schemas:
    HealthResponse:
      title: HealthResponse
      type: object
      required:
        - status
        - service
        - active_focus
      properties:
        status:
          title: Status
          type: string
          description: Health status
        service:
          title: Service
          type: string
          description: Service name
        active_focus:
          title: Active Focus
          type: string
          description: Current delivery focus
    Capability:
      title: Capability
      type: object
      required:
        - name
        - description
        - status
      properties:
        name:
          title: Name
          type: string
          description: Capability name
        description:
          title: Description
          type: string
          description: What the capability is responsible for
        status:
          title: Status
          type: string
          description: Implementation status
    CapabilityCatalog:
      title: CapabilityCatalog
      type: object
      required:
        - product
        - current_phase
        - required_files
        - capabilities
      properties:
        product:
          title: Product
          type: string
          description: Product name
        current_phase:
          title: Current Phase
          type: string
          description: Current roadmap phase
        required_files:
          title: Required Files
          type: array
          description: Project governance files
          items:
            type: string
        capabilities:
          title: Capabilities
          type: array
          description: Supported capabilities in this phase
          items:
            $ref: "#/components/schemas/Capability"
