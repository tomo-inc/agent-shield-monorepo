name: deploy-test

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted
    environment: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull latest and redeploy
        run: |
          cd $GITHUB_WORKSPACE
          sudo docker compose down
          sudo docker compose up --build -d
          sudo docker compose ps

      - name: Health check
        run: |
          sleep 10
          curl -f http://localhost:8088/healthz
